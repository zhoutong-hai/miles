name: E006 K3 H200 Image Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact e006 source commit to build
        required: true
        type: string
      image_tag:
        description: Immutable GHCR tag
        required: true
        type: string
      expected_dockerfile_sha256:
        description: Expected e006 Dockerfile SHA-256
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_ref }}"
          test "$(sha256sum docker/Dockerfile.e006-k3-h200 | awk '{print $1}')" = "${{ inputs.expected_dockerfile_sha256 }}"
          test "$(sha256sum docker/e006/sglang-f22c2d1.patch | awk '{print $1}')" = f2991b18434e6aebb4eb2cc7941e73b7bcf722b691b834878fb265554e44b8be

      - name: Reclaim hosted-runner build space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          docker system prune --all --force --volumes
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.e006-k3-h200
          platforms: linux/amd64
          push: true
          no-cache: true
          provenance: true
          tags: ghcr.io/zhoutong-hai/miles:${{ inputs.image_tag }}

      - name: Record immutable digest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.build.outputs.digest }}"
          printf 'E006_IMAGE=ghcr.io/zhoutong-hai/miles@%s\n' "${{ steps.build.outputs.digest }}"
